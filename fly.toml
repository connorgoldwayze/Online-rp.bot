# fly.toml app configuration file generated for online-rp-bot on 2026-11-13T19:11:33Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'online-rp-bot'
primary_region = 'fra'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
